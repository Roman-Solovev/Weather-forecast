<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Weather forecast</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <main class="app">
            <h1>Weather-forecast</h1>
            <form id ="weatherForm">
                <fieldset>
                    <input id="city" type="text" name="city" required placeholder="Enter city"/>
                    <button type="submit">Send</button>
                </fieldset>
            </form>
            
            <div id="result"></div>
        </main>

        <script type="module" src="app.js"></script>
    </body>
</html>
